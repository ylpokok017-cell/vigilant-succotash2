<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>高小：修辭高手大挑戰</title>
  <link rel="stylesheet" href="assets/tailwind.css">
  <script src="assets/zoom-lock.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      font-family: 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
      touch-action: pan-x pan-y; background-color: #090d16; color: #f8fafc;
      min-height: 100vh; min-height: 100dvh; width: 100%; overflow-x: hidden; overflow-y: auto;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .font-game { font-family: 'Arial Rounded MT Bold', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
    .touch-btn { transition: transform 0.08s ease, opacity 0.08s ease; }
    .touch-btn:active { transform: scale(0.93); }
    .touch-btn:disabled { opacity: 0.5; transform: none; cursor: wait; }
    .answer-btn { touch-action: none; }
    .feedback { min-height: 2rem; font-weight: 800; }
    .feedback-correct { color: #6ee7b7; }
    .feedback-wrong { color: #fda4af; }
  </style>
</head>
<body class="relative">
  <!-- 開始畫面 -->
  <div id="startScreen" role="dialog" aria-modal="true" aria-labelledby="startTitle" class="absolute inset-0 z-50 flex flex-col items-center justify-center p-6 bg-slate-950/95 backdrop-blur-lg">
    <div class="text-center max-w-2xl space-y-6">
      <h1 id="startTitle" class="text-5xl font-black font-game text-amber-400">高小：修辭高手大挑戰</h1>
      <p class="text-slate-300">涵蓋 7 大修辭法（比喻、擬人、誇張、排比、設問、反問、對偶）。兩位玩家每題各答一次，合力攻擊 Boss！共 15 題。</p>
      <button onclick="game.startNewGame()" class="w-full py-5 bg-gradient-to-r from-amber-500 to-red-500 text-slate-950 font-black text-2xl rounded-2xl font-game">⚔️ 開始挑戰</button>
      <a href="index.html" class="block text-slate-400 font-bold hover:underline">🏠 返回主頁</a>
    </div>
  </div>

  <header class="w-full max-w-7xl mx-auto px-4 pt-3 flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800">
    <div>👾 Boss 血量: <span id="monsterHpText" class="text-amber-400 font-mono">400 / 400</span></div>
    <div id="questionNumBadge" class="text-amber-300 font-bold">題目 1 / 15</div>
  </header>

  <main class="w-full max-w-4xl mx-auto px-4 my-auto flex flex-col items-center flex-1 justify-center">
    <div id="bossEmoji" class="text-6xl mb-4 animate-bounce">👾</div>
    <div class="w-full bg-slate-900 border-2 border-amber-500/50 rounded-2xl p-6 text-center shadow-2xl">
      <h2 id="questionText" class="text-xl md:text-2xl font-black text-slate-100">題目載入中...</h2>
    </div>
    <div id="answerFeedback" class="feedback mt-2 text-sm text-slate-300" aria-live="polite">&nbsp;</div>
  </main>

  <footer class="w-full max-w-7xl mx-auto px-4 pb-4">
    <div class="grid grid-cols-2 gap-3 sm:gap-4">
      <section aria-labelledby="p1Label" class="rounded-2xl border-2 border-amber-500/70 bg-slate-900 p-2">
        <div class="flex justify-between px-1 pb-2 text-sm font-black text-amber-300">
          <span id="p1Label">🟨 P1</span><span>分數 <span id="p1Score">0</span></span>
        </div>
        <div id="p1OptionsContainer" class="grid grid-cols-2 gap-2"></div>
      </section>
      <section aria-labelledby="p2Label" class="rounded-2xl border-2 border-sky-500/70 bg-slate-900 p-2">
        <div class="flex justify-between px-1 pb-2 text-sm font-black text-sky-300">
          <span id="p2Label">🟦 P2</span><span>分數 <span id="p2Score">0</span></span>
        </div>
        <div id="p2OptionsContainer" class="grid grid-cols-2 gap-2"></div>
      </section>
    </div>
  </footer>

  <!-- 結算 Modal -->
  <div id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resultTitle" class="hidden absolute inset-0 z-50 flex items-center justify-center p-6 bg-slate-950/95">
    <div class="bg-slate-900 border-2 border-amber-500 rounded-3xl p-8 max-w-lg w-full text-center space-y-6">
      <h2 id="resultTitle" class="text-4xl font-black text-amber-400 font-game">🎉 挑戰成功！</h2>
      <p id="resultSummary" class="text-slate-300 font-bold"></p>
      <div class="flex flex-col sm:flex-row gap-3">
        <button onclick="game.startNewGame()" class="touch-btn flex-1 py-4 bg-amber-500 text-slate-950 font-black text-xl rounded-2xl font-game">🔄 重新挑戰</button>
        <a href="index.html" class="touch-btn flex-1 py-4 bg-slate-700 text-white font-black text-xl rounded-2xl font-game text-center flex items-center justify-center">🏠 返回主頁</a>
      </div>
    </div>
  </div>

  <script>
    // 15 題七大修辭題庫
    const rawQuestions = [
      { q: "「太陽像一個巨大的火球，懸掛在藍天上。」請問這句話使用了哪種修辭？", options: ["比喻", "擬人", "誇張", "排比"], answer: 0 },
      { q: "「妹妹的臉蛋紅得像熟透的蘋果。」這是使用了哪種修辭法？", options: ["對偶", "比喻", "設問", "反問"], answer: 1 },
      { q: "「太陽公公露出了燦爛的微笑。」請問這句話使用了哪種修辭？", options: ["誇張", "擬人", "排比", "對偶"], answer: 1 },
      { q: "「花兒在微風中翩翩起舞。」這是運用了什麼修辭法？", options: ["比喻", "反問", "擬人", "設問"], answer: 2 },
      { q: "「頑皮的雨滴在屋頂上跳芭蕾舞。」這屬於哪種修辭？", options: ["擬人", "誇張", "排比", "對偶"], answer: 0 },
      { q: "「這間教室安靜得連一根針掉在地上都聽得見。」使用了什麼修辭？", options: ["排比", "誇張", "對偶", "擬人"], answer: 1 },
      { q: "「我餓得可以吃下一整頭大象了！」這句話運用了什麼修辭？", options: ["誇張", "比喻", "設問", "反問"], answer: 0 },
      { q: "「燕子去了，有再來的時候；楊柳枯了，有再青的時候；桃花謝了，有再開的時候。」這是什麼修辭？", options: ["誇張", "比喻", "排比", "設問"], answer: 2 },
      { q: "「誰是最勇敢的人？就是那位冒險救人的消防員。」使用了哪種修辭？", options: ["反問", "設問", "對偶", "誇張"], answer: 1 },
      { q: "「難道我們不應該好好珍惜寶貴的時間嗎？」這句話屬於什麼修辭？", options: ["設問", "反問", "誇張", "比喻"], answer: 1 },
      { q: "「白日依山盡，黃河入海流。」請問使用了哪種修辭？", options: ["排比", "誇張", "對偶", "擬人"], answer: 2 },
      { q: "「綠樹村邊合，青山郭外斜。」這是運用了什麼修辭法？", options: ["對偶", "誇張", "設問", "比喻"], answer: 0 },
      { q: "「他笑起來的聲音大得連屋頂都快被震翻了。」這是什麼修辭？", options: ["誇張", "比喻", "對偶", "擬人"], answer: 0 },
      { q: "「什麼是真正的勇氣？真正的勇氣是在害怕時仍然向前。」這是什麼修辭？", options: ["設問", "反問", "誇張", "排比"], answer: 0 },
      { q: "「春天有花開的喜悅，夏天有蟬鳴的熱鬧，秋天有落葉的詩意。」這是什麼修辭？", options: ["對偶", "排比", "設問", "擬人"], answer: 1 }
    ];

    let audioCtx = null;
    function initAudio() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      if (!audioCtx) audioCtx = new AudioContextClass();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function playSound(type) {
      try {
        if (!initAudio()) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'hit') {
          osc.frequency.setValueAtTime(320, now); osc.frequency.exponentialRampToValueAtTime(850, now + 0.12);
          gain.gain.setValueAtTime(0.35, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'miss') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now); osc.frequency.exponentialRampToValueAtTime(90, now + 0.16);
          gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
          osc.start(now); osc.stop(now + 0.16);
        } else if (type === 'win') {
          [440, 554.37, 659.25, 880].forEach((freq, idx) => {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.setValueAtTime(freq, now + idx * 0.09);
            g.gain.setValueAtTime(0.3, now + idx * 0.09); g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.09 + 0.2);
            o.start(now + idx * 0.09); o.stop(now + idx * 0.09 + 0.2);
          });
        }
      } catch(e){}
    }

    class GameEngine {
      constructor() {
        this.currentIndex = 0; this.maxHp = 400; this.hp = this.maxHp;
        this.scores = { p1: 0, p2: 0 }; this.questions = [];
        this.roundActive = false; this.answerTimer = null;
        this.roundAnswers = { p1: false, p2: false };
        this.roundSelections = { p1: null, p2: null };
      }
      startNewGame() {
        clearTimeout(this.answerTimer);
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('resultModal').classList.add('hidden');
        this.questions = [...rawQuestions].sort(() => Math.random() - 0.5).slice(0, 15);
        this.currentIndex = 0; this.hp = this.maxHp;
        this.scores = { p1: 0, p2: 0 };
        this.roundAnswers = { p1: false, p2: false };
        this.roundSelections = { p1: null, p2: null };
        document.getElementById('answerFeedback').textContent = '\u00a0';
        this.updateUI(); this.nextQ();
      }
      nextQ() {
        if (this.currentIndex >= this.questions.length) { this.endGame(); return; }
        this.roundActive = true;
        this.roundAnswers = { p1: false, p2: false };
        this.roundSelections = { p1: null, p2: null };
        this.setPlayerButtonsDisabled('p1', false);
        this.setPlayerButtonsDisabled('p2', false);
        const q = this.questions[this.currentIndex];
        document.getElementById('questionNumBadge').innerText = `題目 ${this.currentIndex + 1} / ${this.questions.length}`;
        document.getElementById('questionText').innerText = q.q;
        const feedback = document.getElementById('answerFeedback');
        feedback.textContent = '\u00a0';
        feedback.className = 'feedback mt-2 text-sm text-slate-300';

        ['p1OptionsContainer', 'p2OptionsContainer'].forEach(boxId => {
          const box = document.getElementById(boxId);
          box.innerHTML = '';
          const playerKey = boxId === 'p1OptionsContainer' ? 'p1' : 'p2';
          q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.dataset.answerButton = '';
            btn.dataset.player = playerKey;
            btn.className = playerKey === 'p1'
              ? 'answer-btn touch-btn h-12 bg-amber-500 text-slate-950 font-black rounded-xl border border-amber-300 font-game'
              : 'answer-btn touch-btn h-12 bg-sky-600 text-white font-black rounded-xl border border-sky-300 font-game';
            btn.innerText = opt;
            const submitAnswer = () => this.handleAnswer(playerKey, idx, q);
            btn.addEventListener('pointerdown', submitAnswer);
            btn.onclick = submitAnswer;
            box.appendChild(btn);
          });
        });
      }
      handleAnswer(playerKey, optionIndex, question) {
        if (!this.roundActive || this.roundAnswers[playerKey] || question !== this.questions[this.currentIndex]) return;
        this.roundAnswers[playerKey] = true;
        this.roundSelections[playerKey] = optionIndex;
        this.setPlayerButtonsDisabled(playerKey, true);
        const isCorrect = optionIndex === question.answer;
        if (isCorrect) {
          this.scores[playerKey]++;
          this.hp = Math.max(0, this.hp - 80);
        }
        playSound(isCorrect ? 'hit' : 'miss');
        this.updateUI();
        const feedback = document.getElementById('answerFeedback');
        if (!this.roundAnswers.p1 || !this.roundAnswers.p2) {
          const waitingFor = playerKey === 'p1' ? 'P2' : 'P1';
          feedback.textContent = `${playerKey.toUpperCase()} 已作答，等待 ${waitingFor}…`;
          feedback.className = 'feedback mt-2 text-sm text-slate-300';
          return;
        }

        this.roundActive = false;
        this.setButtonsDisabled(true);
        const p1Correct = this.roundSelections.p1 === question.answer;
        const p2Correct = this.roundSelections.p2 === question.answer;
        feedback.textContent = `P1 ${p1Correct ? '✅' : '❌'} · P2 ${p2Correct ? '✅' : '❌'}　正確答案：${question.options[question.answer]}`;
        feedback.className = `feedback mt-2 text-sm ${p1Correct || p2Correct ? 'feedback-correct' : 'feedback-wrong'}`;
        this.answerTimer = setTimeout(() => {
          this.currentIndex++;
          this.nextQ();
        }, 850);
      }
      setPlayerButtonsDisabled(playerKey, disabled) {
        document.querySelectorAll(`[data-player="${playerKey}"]`).forEach(button => { button.disabled = disabled; });
      }
      setButtonsDisabled(disabled) {
        this.setPlayerButtonsDisabled('p1', disabled);
        this.setPlayerButtonsDisabled('p2', disabled);
      }
      updateUI() {
        document.getElementById('monsterHpText').innerText = `${this.hp} / ${this.maxHp}`;
        document.getElementById('bossEmoji').innerText = this.hp <= 0 ? '💥' : '👾';
        document.getElementById('p1Score').innerText = this.scores.p1;
        document.getElementById('p2Score').innerText = this.scores.p2;
      }
      endGame() {
        clearTimeout(this.answerTimer);
        this.roundActive = false;
        this.setButtonsDisabled(true);
        const success = this.hp <= 0;
        const title = document.getElementById('resultTitle');
        title.innerText = success ? '🎉 挑戰成功！' : '💥 挑戰失敗！';
        title.className = success
          ? 'text-4xl font-black text-emerald-400 font-game'
          : 'text-4xl font-black text-rose-400 font-game';
        const mvp = this.scores.p1 === this.scores.p2
          ? 'MVP：雙方平手'
          : `MVP：${this.scores.p1 > this.scores.p2 ? 'P1' : 'P2'}`;
        document.getElementById('resultSummary').innerText =
          `Boss 剩餘 ${this.hp}/${this.maxHp} · P1 ${this.scores.p1} 分 · P2 ${this.scores.p2} 分 · ${mvp}`;
        document.getElementById('resultModal').classList.remove('hidden');
        playSound(success ? 'win' : 'miss');
      }
    }
    const game = new GameEngine();
  </script>
</body>
</html>
